# ─────────────────────────────────────────────────────────────────────────────
# Anti-pause Supabase (plan gratuit) : le projet est mis en pause après ~7 jours
# sans activité → ce workflow fait une vraie requête REST chaque jour pour
# maintenir le compteur à zéro. Découvert le 2026-07-02 : projet INACTIVE,
# prod down, restauration manuelle nécessaire.
#
# URL et clé lues depuis les secrets du repo (Settings → Secrets and
# variables → Actions → Secrets → SUPABASE_URL / SUPABASE_ANON_KEY) — plus
# aucune valeur en dur ici. La clé anon reste publique par nature (déjà dans
# le bundle JS de l'app) ; le repo étant public, coder le project ref en dur
# offrait du fingerprinting gratuit (versions Postgres/GoTrue/Storage
# exactes via /rest/v1/) — d'où `secrets` plutôt que `vars`, malgré le fait
# que la valeur elle-même ne soit pas sensible.
#
# ⚠️ ACTION MANUELLE REQUISE avant la prochaine exécution planifiée (chaque
# jour à 05:17 UTC) : créer ces deux secrets dans les réglages du repo, sinon
# ce workflow échoue à chaque run et le filet anti-pause cesse de fonctionner.
#   gh secret set SUPABASE_URL --body "https://<project-ref>.supabase.co"
#   gh secret set SUPABASE_ANON_KEY --body "sb_publishable_..."
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours sans commit sur le
# repo (email d'avertissement avant). Tant que le projet est développé
# activement, aucun souci.
# ─────────────────────────────────────────────────────────────────────────────
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours à 05:17 UTC (heure creuse)
  workflow_dispatch: {}     # déclenchable à la main pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (reset du compteur d'inactivité)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL ou SUPABASE_ANON_KEY absent des secrets du repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase REST → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ne répond pas correctement (HTTP $code) — projet en pause ?"
            exit 1
          fi
